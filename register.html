<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusCrib</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['Inter', 'system-ui', 'sans-serif'],
              'display': ['Poppins', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
<body class="font-sans bg-gradient-to-br from-purple-600 via-blue-600 to-teal-600 min-h-screen flex items-center justify-center p-4">
    <div class="backdrop-blur-xl bg-white/10 border border-white/20 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-display font-bold text-white mb-2">
                <span class="bg-gradient-to-r from-yellow-300 to-orange-400 bg-clip-text text-transparent">Campus</span><span class="text-white">Crib</span>
            </h1>
            <p class="text-blue-100">Join the student community!</p>
        </div>
        
        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-white/90 mb-2">Full Name</label>
                <input type="text" id="fullName" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent backdrop-blur-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-white/90 mb-2">Username</label>
                <input type="text" id="username" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent backdrop-blur-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-white/90 mb-2">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent backdrop-blur-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-white/90 mb-2">Phone</label>
                <input type="tel" id="phone" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent backdrop-blur-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-white/90 mb-2">Course</label>
                <input type="text" id="course" placeholder="e.g., BBA, MBA, B.Tech" class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent backdrop-blur-sm">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-white/90 mb-2">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent backdrop-blur-sm">
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 hover:from-yellow-500 hover:to-orange-600 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105">
                Create Account
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-sm text-blue-100">
                Already have an account? 
                <a href="login.html" class="text-yellow-300 hover:text-yellow-200 font-medium transition-colors">Login here</a>
            </p>
            <a href="index.html" class="text-sm text-white/60 hover:text-white/80 transition-colors">← Back to Home</a>
        </div>
        
        <div id="message" class="mt-4 p-3 rounded hidden"></div>
    </div>
    
    <script src="js/auth.js"></script>
</body>
</html>
