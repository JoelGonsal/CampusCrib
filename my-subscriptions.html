<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Subscriptions | CampusCrib</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="modern-style.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['Inter', 'system-ui', 'sans-serif'],
              'display': ['Poppins', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
<body class="font-sans bg-gradient-to-br from-blue-50 via-white to-purple-50 min-h-screen">
    <!-- Navbar -->
    <nav class="navbar-modern sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="nav-container flex justify-between items-center h-18 py-2">
                <div class="flex items-center">
                    <div class="logo-container">
                        <div class="text-2xl font-display logo-text">
                            CampusCrib
                        </div>
                    </div>
                </div>
                
                <div class="hidden md:block nav-links">
                    <div class="flex items-center space-x-1">
                        <a href="index.html" class="nav-link text-gray-600">
                            <span>Home</span>
                        </a>
                        <a href="pgs.html" class="nav-link text-gray-600">
                            <span>PGs/Flats</span>
                        </a>
                        <a href="tiffen.html" class="nav-link text-gray-600">
                            <span>Tiffin</span>
                        </a>
                        <a href="roommate.html" class="nav-link text-gray-600">
                            <span>Roommates</span>
                        </a>
                        <a href="my-rentals.html" class="nav-link text-gray-600">
                            <span>My Rentals</span>
                        </a>
                        <a href="my-tenants.html" class="nav-link text-gray-600">
                            <span>My Tenants</span>
                        </a>
                        <a href="contact.html" class="nav-link text-gray-600">
                            <span>Contact</span>
                        </a>
                    </div>
                </div>
                
                <div class="auth-buttons" id="authButtons">
                    <a href="dashboard.html" class="text-gray-600 hover:text-gray-800 px-3 py-2">Dashboard</a>
                    <button onclick="logout()" class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white px-4 py-2 rounded-lg font-medium transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-800">
        <div class="pt-8 pb-12 px-4 sm:px-6 lg:px-8">
            <div class="max-w-4xl mx-auto">
                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-4xl md:text-5xl font-display font-bold text-white mb-4">
                        My Tiffin Subscriptions
                    </h1>
                    <p class="text-xl text-gray-300">
                        Manage your active tiffin service subscriptions
                    </p>
                </div>

                <!-- Subscriptions List -->
                <div class="bg-white/95 backdrop-blur-xl border border-white/20 p-8 rounded-2xl shadow-2xl">
                    <div id="loadingState" class="text-center py-8">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                        <p class="text-gray-600">Loading your subscriptions...</p>
                    </div>

                    <div id="subscriptionsList" class="hidden space-y-6">
                        <!-- Dynamic content will be loaded here -->
                    </div>

                    <div id="noSubscriptions" class="text-center py-12 hidden">
                        <div class="text-6xl mb-4">🍽️</div>
                        <h3 class="text-2xl font-bold text-gray-800 mb-2">No Subscriptions Yet</h3>
                        <p class="text-gray-600 mb-6">You haven't subscribed to any tiffin services yet.</p>
                        <a href="tiffen.html" class="inline-flex items-center px-6 py-3 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-xl font-semibold hover:scale-105 transition-all duration-300">
                            Browse Tiffin Services
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            if (!isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            await loadSubscriptions();
        });

        async function loadSubscriptions() {
            const loadingState = document.getElementById('loadingState');
            const subscriptionsList = document.getElementById('subscriptionsList');
            const noSubscriptions = document.getElementById('noSubscriptions');
            
            try {
                const result = await apiCall('/my-subscriptions');
                
                if (result.success) {
                    const subscriptions = result.data;
                    
                    loadingState.classList.add('hidden');
                    
                    if (subscriptions.length === 0) {
                        noSubscriptions.classList.remove('hidden');
                    } else {
                        displaySubscriptions(subscriptions);
                        subscriptionsList.classList.remove('hidden');
                    }
                } else {
                    throw new Error('Failed to load subscriptions');
                }
            } catch (error) {
                console.error('Error loading subscriptions:', error);
                loadingState.innerHTML = `
                    <div class="text-red-500 text-center py-8">
                        <div class="text-6xl mb-4">⚠️</div>
                        <h3 class="text-2xl font-bold mb-2">Failed to Load Subscriptions</h3>
                        <p class="text-lg">Please check your connection and try again.</p>
                        <button onclick="location.reload()" class="mt-4 bg-indigo-600 text-white px-6 py-2 rounded hover:bg-indigo-700">Retry</button>
                    </div>
                `;
            }
        }

        function displaySubscriptions(subscriptions) {
            const subscriptionsList = document.getElementById('subscriptionsList');
            
            subscriptionsList.innerHTML = subscriptions.map(sub => `
                <div class="border border-gray-200 rounded-xl p-6 hover:shadow-lg transition-shadow duration-300">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-xl font-bold text-gray-800 mb-1">${sub.service_name}</h3>
                            <p class="text-gray-600">📍 ${sub.location}</p>
                            <p class="text-sm text-gray-500">Provider: ${sub.provider_name}</p>
                        </div>
                        <div class="text-right">
                            <span class="inline-block px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium mb-2">
                                ${sub.subscription_type}
                            </span>
                            <p class="text-lg font-bold text-green-600">₹${sub.price_per_meal}/meal</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <span class="text-sm text-gray-500">Start Date:</span>
                            <p class="font-medium">${new Date(sub.start_date).toLocaleDateString()}</p>
                        </div>
                        ${sub.end_date ? `
                            <div>
                                <span class="text-sm text-gray-500">End Date:</span>
                                <p class="font-medium">${new Date(sub.end_date).toLocaleDateString()}</p>
                            </div>
                        ` : ''}
                        <div class="md:col-span-2">
                            <span class="text-sm text-gray-500">Delivery Address:</span>
                            <p class="font-medium">${sub.delivery_address}</p>
                        </div>
                        <div>
                            <span class="text-sm text-gray-500">Delivery Time:</span>
                            <p class="font-medium">${sub.delivery_time}</p>
                        </div>
                        <div>
                            <span class="text-sm text-gray-500">Your Contact:</span>
                            <p class="font-medium">${sub.phone_number}</p>
                        </div>
                        ${sub.special_instructions ? `
                            <div class="md:col-span-2">
                                <span class="text-sm text-gray-500">Special Instructions:</span>
                                <p class="font-medium">${sub.special_instructions}</p>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="flex justify-between items-center pt-4 border-t border-gray-100">
                        <span class="text-sm text-gray-500">
                            Subscribed: ${new Date(sub.created_at).toLocaleDateString()}
                        </span>
                        <div class="flex gap-3">
                            <a href="https://wa.me/${sub.provider_phone}?text=Hi%2C%20this%20is%20regarding%20my%20tiffin%20subscription%20for%20${encodeURIComponent(sub.service_name)}" 
                               target="_blank"
                               class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition text-sm">
                                💬 Contact Provider
                            </a>
                            <button onclick="cancelSubscription(${sub.id}, '${sub.service_name}')" 
                                    class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition text-sm">
                                Cancel Subscription
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function cancelSubscription(subscriptionId, serviceName) {
            if (!confirm(`Are you sure you want to cancel your subscription to "${serviceName}"?`)) {
                return;
            }
            
            try {
                const result = await apiCall(`/subscriptions/${subscriptionId}`, {
                    method: 'DELETE'
                });
                
                if (result.success) {
                    alert('Subscription cancelled successfully!');
                    await loadSubscriptions(); // Reload the list
                } else {
                    alert(result.data.message || 'Failed to cancel subscription');
                }
            } catch (error) {
                console.error('Error cancelling subscription:', error);
                alert('Network error. Please try again.');
            }
        }
    </script>
</body>
</html>
