<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Tiffin Service | CampusCrib</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="modern-style.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['Inter', 'system-ui', 'sans-serif'],
              'display': ['Poppins', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
<body class="font-sans bg-gradient-to-br from-orange-50 via-white to-red-50 min-h-screen">
    <!-- Navbar -->
    <nav class="navbar-modern sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="nav-container flex justify-between items-center h-18 py-2">
                <div class="flex items-center">
                    <div class="logo-container">
                        <div class="text-2xl font-display logo-text">
                            CampusCrib
                        </div>
                    </div>
                </div>
                
                <div class="hidden md:block nav-links">
                    <div class="flex items-center space-x-1">
                        <a href="index.html" class="nav-link text-gray-600">
                            <span>Home</span>
                        </a>
                        <a href="pgs.html" class="nav-link text-gray-600">
                            <span>PGs/Flats</span>
                        </a>
                        <a href="tiffen.html" class="nav-link active text-orange-600">
                            <span>Tiffin</span>
                        </a>
                        <a href="roommate.html" class="nav-link text-gray-600">
                            <span>Roommates</span>
                        </a>
                        <a href="contact.html" class="nav-link text-gray-600">
                            <span>Contact</span>
                        </a>
                    </div>
                </div>
                
                <div class="flex items-center gap-3" id="authButtons">
                    <a href="dashboard.html" class="bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105">
                        Dashboard
                    </a>
                    <button onclick="logout()" class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white px-4 py-2 rounded-lg font-medium transition-all duration-300 shadow-lg hover:shadow-xl hover:scale-105">
                        Logout
                    </button>
                </div>

                <!-- Mobile menu button -->
                <button class="mobile-menu-btn md:hidden">
                    <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Add Tiffin Form -->
        <div class="container mx-auto px-10 py-8">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white bg-opacity-95 backdrop-blur-md p-8 rounded-xl shadow-lg">
                    <h1 class="text-3xl font-bold text-gray-800 mb-6">Add Your Tiffin Service</h1>
                    
                    <form id="addTiffinForm" class="space-y-6">
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Service Name *</label>
                                <input type="text" id="serviceName" required 
                                       placeholder="e.g., Ruchi's Rasoi, Mom's Kitchen"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Meal Type *</label>
                                <select id="mealType" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500">
                                    <option value="">Select Meal Type</option>
                                    <option value="veg">Vegetarian Only</option>
                                    <option value="non_veg">Non-Vegetarian Only</option>
                                    <option value="both">Both Veg & Non-Veg</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Location *</label>
                                <input type="text" id="location" required 
                                       placeholder="e.g., Andheri East"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Area/Locality *</label>
                                <input type="text" id="area" required 
                                       placeholder="e.g., Near NMIMS Gate"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            </div>
                        </div>
                        
                        <div class="grid md:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Price per Meal (₹) *</label>
                                <input type="number" id="pricePerMeal" required min="50" 
                                       placeholder="e.g., 120"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Cuisine Type</label>
                                <input type="text" id="cuisineType" 
                                       placeholder="e.g., Gujarati, North Indian"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Delivery Time</label>
                                <input type="text" id="deliveryTime" 
                                       placeholder="e.g., 12:00 PM - 2:00 PM"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                            <textarea id="description" rows="4" 
                                      placeholder="Describe your tiffin service, specialties, cooking style, etc."
                                      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500"></textarea>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Menu Items</label>
                            <div id="menuItemsContainer" class="space-y-2">
                                <input type="text" class="menu-item w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500" 
                                       placeholder="e.g., Dal, Rice, Roti, Sabzi">
                                <input type="text" class="menu-item w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500" 
                                       placeholder="e.g., Pickle, Salad, Sweet">
                            </div>
                            <button type="button" onclick="addMenuItem()" class="mt-2 text-yellow-600 hover:text-yellow-700 text-sm">+ Add More Items</button>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Delivery Areas</label>
                            <div id="deliveryAreasContainer" class="space-y-2">
                                <input type="text" class="delivery-area w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500" 
                                       placeholder="e.g., Andheri East">
                                <input type="text" class="delivery-area w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500" 
                                       placeholder="e.g., Vile Parle">
                            </div>
                            <button type="button" onclick="addDeliveryArea()" class="mt-2 text-yellow-600 hover:text-yellow-700 text-sm">+ Add More Areas</button>
                        </div>
                        
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Contact Number *</label>
                                <input type="tel" id="contactNumber" required 
                                       placeholder="e.g., 9876543210"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">WhatsApp Number</label>
                                <input type="tel" id="whatsappNumber" 
                                       placeholder="e.g., 9876543210"
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500">
                            </div>
                        </div>
                        
                        <div class="flex gap-4">
                            <button type="submit" class="flex-1 bg-yellow-600 text-white py-3 px-6 rounded-lg hover:bg-yellow-700 transition duration-300 font-medium">
                                Post Tiffin Service
                            </button>
                            <a href="dashboard.html" class="flex-1 bg-gray-600 text-white py-3 px-6 rounded-lg hover:bg-gray-700 transition duration-300 font-medium text-center">
                                Cancel
                            </a>
                        </div>
                    </form>
                    
                    <div id="message" class="mt-4 p-3 rounded hidden"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/add-tiffin.js"></script>
</body>
</html>
